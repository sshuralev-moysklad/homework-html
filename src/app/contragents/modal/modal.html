<div
    id="contragent-modal"
    tabindex="-1"
    aria-hidden="true"
    class="hidden overflow-y-auto overflow-x-hidden fixed top-0 right-0 left-0 z-50 justify-center items-center w-full md:inset-0 h-[calc(100%-1rem)] max-h-full"
>
    <div class="relative p-4 w-full max-w-md max-h-full">
        <div class="relative bg-white rounded-lg shadow">
            <div class="flex items-center justify-between p-4 md:p-5 border-b rounded-t">
                <h3 class="text-xl font-semibold text-gray-900">Контрагент</h3>
                <button
                    type="button"
                    data-modal-cancel
                    class="text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm w-8 h-8 ms-auto inline-flex justify-center items-center"
                >
                    <svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"/>
                    </svg>
                    <span class="sr-only">Закрыть</span>
                </button>
            </div>
            <form data-contragent-form class="p-4 md:p-5 space-y-4">
                <div>
                    <label for="contragent-name" class="block mb-2 text-sm font-medium text-gray-900">Наименование</label>
                    <input
                        type="text"
                        id="contragent-name"
                        name="name"
                        class="contragent-input bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
                    />
                </div>
                <div>
                    <label for="contragent-inn" class="block mb-2 text-sm font-medium text-gray-900">ИНН</label>
                    <input
                        type="text"
                        id="contragent-inn"
                        name="inn"
                        maxlength="11"
                        inputmode="numeric"
                        class="contragent-input bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
                    />
                    <p class="hidden mt-2 text-sm text-red-600" data-error="inn">ИНН должен содержать 11 цифр</p>
                </div>
                <div>
                    <label for="contragent-address" class="block mb-2 text-sm font-medium text-gray-900">Адрес</label>
                    <input
                        type="text"
                        id="contragent-address"
                        name="address"
                        class="contragent-input bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
                    />
                </div>
                <div>
                    <label for="contragent-kpp" class="block mb-2 text-sm font-medium text-gray-900">КПП</label>
                    <input
                        type="text"
                        id="contragent-kpp"
                        name="kpp"
                        maxlength="9"
                        inputmode="numeric"
                        class="contragent-input bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
                    />
                    <p class="hidden mt-2 text-sm text-red-600" data-error="kpp">КПП должен содержать 9 цифр</p>
                </div>
                <div class="flex items-center gap-3">
                    <button
                        type="submit"
                        class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5"
                    >
                        Сохранить
                    </button>
                    <button
                        type="button"
                        data-modal-cancel
                        class="text-gray-900 bg-white border border-gray-300 hover:bg-gray-100 focus:ring-4 focus:outline-none focus:ring-gray-200 font-medium rounded-lg text-sm px-5 py-2.5"
                    >
                        Отменить
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
