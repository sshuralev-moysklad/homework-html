<div class="relative overflow-x-auto">
    <table class="w-full text-sm text-left text-gray-500">
        <thead class="text-xs text-gray-700 uppercase bg-gray-50">
            <tr>
                <th scope="col" class="px-6 py-3">Наименование</th>
                <th scope="col" class="px-6 py-3">ИНН</th>
                <th scope="col" class="px-6 py-3">Адрес</th>
                <th scope="col" class="px-6 py-3">КПП</th>
                <th scope="col" class="px-6 py-3"></th>
            </tr>
        </thead>
        <tbody data-contragents-body></tbody>
    </table>
</div>

<template id="contragent-row-template">
    <tr class="bg-white border-b cursor-pointer hover:bg-gray-50" data-id="">
        <th scope="row" class="px-6 py-4 font-medium text-gray-900 whitespace-nowrap" data-field="name"></th>
        <td class="px-6 py-4" data-field="inn"></td>
        <td class="px-6 py-4" data-field="address"></td>
        <td class="px-6 py-4" data-field="kpp"></td>
        <td class="px-6 py-4">
            <button
                type="button"
                data-delete
                class="text-white bg-red-700 hover:bg-red-800 focus:ring-4 focus:outline-none focus:ring-red-300 font-medium rounded-lg text-sm px-4 py-2"
            >
                Удалить
            </button>
        </td>
    </tr>
</template>
